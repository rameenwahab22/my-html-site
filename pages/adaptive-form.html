
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adaptive Form</title>

  <style>
    /* Default light theme */
    :root {
      --bg: #ffffff;
      --text: #1e293b;
      --field-bg: #f1f5f9;
    }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --text: #f8fafc;
        --field-bg: #1e293b;
      }
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    input, select, textarea {
      display: block;
      box-sizing: border-box;
      margin: 8px 0 16px;
      padding: 10px;
      max-width: 100%;
      background: var(--field-bg);
      color: var(--text);
      border: 1px solid #64748b;
      border-radius: 5px;
    }

    .adaptive-btn {
      padding: 10px 18px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .adaptive-btn:hover {
      transform: scale(1.05);
    }

    /* Reduce animation for accessibility */
    @media (prefers-reduced-motion: reduce) {
      .adaptive-btn {
        transition: none;
      }

      .adaptive-btn:hover {
        transform: none;
      }
    }

    /* Mobile layout */
    @media (max-width: 600px) {
      body {
        margin: 10px auto;
        padding: 16px;
      }

      input, select, textarea {
        width: 100%;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <h1>Registration Form</h1>
  <p>This form adapts to your theme and screen size.</p>

  <form>
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required>

    <label for="course">Choose a Course</label>
    <select id="course" name="course">
      <option>HTML</option>
      <option>CSS</option>
      <option>JavaScript</option>
    </select>

    <label for="comments">Comments</label>
    <textarea id="comments" name="comments" rows="4"></textarea>

    <button class="adaptive-btn" type="submit">
      Register
    </button>
  </form>

</body>
</html>
