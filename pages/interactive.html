
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File API Demo</title>
</head>
<body>
  <h1>File API Demo</h1>

  <!-- User selects a file -->
  <input type="file" id="fileInput">

  <!-- Displays the file details -->
  <pre id="fileInfo">No file selected</pre>

  <script>
    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];

      document.getElementById('fileInfo').textContent =
        file ? `Name: ${file.name}, Size: ${file.size} bytes` : 'No file selected';
    });
  </script>
  
<h2>Drag and Drop an Image</h2>

<div id="dropZone" style="border:2px dashed #64748b;padding:40px;text-align:center;">
  Drag an image here
</div>

<img id="preview" alt="Preview" style="max-width:200px;margin-top:12px;">

<script>
  const dropZone = document.getElementById('dropZone');
  const preview = document.getElementById('preview');

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();

    const file = e.dataTransfer.files[0];

    if (!file || !file.type.startsWith('image/')) return;

    const reader = new FileReader();

    reader.onload = () => {
      preview.src = reader.result;
    };

    reader.readAsDataURL(file);
  });
</script>


<h2>HTML5 Video</h2>

<video controls width="320">
  <source
    src="https://www.w3schools.com/html/mov_bbb.mp4"
    type="video/mp4">
  Your browser does not support video.
</video>

<h2>HTML5 Audio</h2>

<audio controls>
  <source
    src="https://www.w3schools.com/html/horse.mp3"
    type="audio/mpeg">
  Your browser does not support audio.
</audio>

<!-- Button triggers location request -->
<button id="locBtn">Get my location</button>
<!-- Coordinates or error message shown here -->
<p id="location">Location not requested yet</p>
<script>
  document.getElementById('locBtn').addEventListener('click', () => {
    // Ask browser for device location (user must click Allow)
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        // Success: show latitude and longitude
        document.getElementById('location').textContent =
          `Lat: ${pos.coords.latitude}, Lng: ${pos.coords.longitude}`;
      },
      () => {
        // Error: user denied permission or location unavailable
        document.getElementById('location').textContent = 'Permission denied';
      }
    );
  });
</script>

<!-- Browser context info displayed on the page -->
<p id="context"></p>
<script>
  // Collect useful browser/device info from the navigator object
  const ctx = {
    online: navigator.onLine,       // true if connected to internet
    language: navigator.language,   // e.g. "en-ZA"
    mobile: /Mobi|Android/i.test(navigator.userAgent) // detect mobile device
  };
  // Show context as formatted JSON on the page
  document.getElementById('context').textContent = JSON.stringify(ctx, null, 2);
  // Also log to DevTools Console for debugging (F12 → Console)
  console.log('PM-04 debug context:', ctx);
</script>
</body>
</html>
