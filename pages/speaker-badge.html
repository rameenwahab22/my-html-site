<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Speaker Badge</title>
</head>
<body>
  <h1>Speaker Badge (Canvas)</h1>
  <canvas id="badge" width="320" height="120"></canvas>
  <script>
    const ctx = document.getElementById('badge').getContext('2d');
    const speakerName = 'Alex Mthembu'; // Change to your name

    // Draw rounded badge background
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.roundRect(10, 10, 300, 100, 12);
    ctx.fill();

    // Avatar circle placeholder
    ctx.beginPath();
    ctx.arc(60, 60, 35, 0, Math.PI * 2);
    ctx.fillStyle = '#3b82f6';
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('AM', 60, 68); // Initials

    // Speaker name and role
    ctx.textAlign = 'left';
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText(speakerName, 110, 55);
    ctx.font = '14px sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('Keynote Speaker', 110, 78);
  </script>
</body>
</html>
